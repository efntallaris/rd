# Test topology: sg4 (migration recipient) with FIVE replicas, to exercise the
# chain paths that need f = 2: redis3 leader + redis4, redis5, ycsb1, ycsb0 as
# chain followers (in that order). ycsb0/ycsb1 also stay YCSB clients.
# Use with: -e @sg4_5replica.yml   (overrides redisraft_shardgroups)
[redis_masters]
redis0 ansible_connection=local
redis1
redis2

[redis_migrate]
redis3

[redis_migrate_replicas]
redis4
redis5
ycsb1
ycsb0

[redis_spare]

[redis_nodes:children]
redis_masters
redis_migrate
redis_migrate_replicas
redis_spare

[ycsb_nodes]
ycsb0
ycsb1

[all:children]
redis_nodes
ycsb_nodes
