# 3 -> 6 scale-out (experiments/custom_scaleout_3to6): donors sg1/sg2/sg3 on
# redis0/1/2, recipients sg4/sg5/sg6 on redis3/4/5 (each host leads one group
# and follows two). All three recipient hosts are in redis_migrate so they are
# monitored and their logs collected like the donors'.
# Use with: -e @experiments/custom_scaleout_3to6/topology.yml
[redis_masters]
redis0 ansible_connection=local
redis1
redis2

[redis_migrate]
redis3
redis4
redis5

[redis_migrate_replicas]

[redis_spare]

[redis_nodes:children]
redis_masters
redis_migrate
redis_migrate_replicas
redis_spare

[ycsb_nodes]
ycsb0
ycsb1

[all:children]
redis_nodes
ycsb_nodes
