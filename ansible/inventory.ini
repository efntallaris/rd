# 6 redis nodes (redis0-5) for shard groups + 2 YCSB clients (ycsb0, ycsb1).
# Donors sg1/sg2/sg3 are 3-way replicated across redis0/redis1/redis2.
# sg4 (migration recipient): redis3 leader + redis4/redis5 chain followers.
# (Previous topology with ycsb1 as sg4's F2 saved in inventory_chainfollower_ycsb1.ini)
[redis_masters]
redis0 ansible_connection=local
redis1
redis2

[redis_migrate]
redis3

[redis_migrate_replicas]
redis4
redis5

[redis_spare]

[redis_nodes:children]
redis_masters
redis_migrate
redis_migrate_replicas
redis_spare

[ycsb_nodes]
ycsb0
ycsb1

[all:children]
redis_nodes
ycsb_nodes
