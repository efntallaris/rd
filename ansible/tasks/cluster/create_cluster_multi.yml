---
# Like create_cluster.yml, but for {{ procs_per_host }} processes per master
# host (see start_redis_instances_multi.yml). Every process becomes a master;
# redis-cli splits the 16384 slots evenly across all of them.
- name: "Create Redis cluster (procs_per_host masters per host)"
  hosts: redis_masters[0]
  become: yes
  vars:
    redis_ports: "{{ range(master_port | int, master_port | int + procs_per_host | default(1) | int) | list }}"
  tasks:
    - name: Wait for Redis to be ready on all masters
      wait_for:
        host: "{{ item.0 }}"
        port: "{{ item.1 }}"
        timeout: 30
      loop: "{{ groups['redis_masters'] | product(redis_ports) | list }}"

    # IPs, not hostnames: see create_cluster.yml.
    - name: Resolve master hostnames to IPs
      shell: "getent hosts {{ item }} | awk '{print $1}'"
      register: master_ips
      changed_when: false
      loop: "{{ groups['redis_masters'] }}"

    - name: Create Redis cluster
      command: >
        {{ redis_bin_dir }}/redis-cli --cluster create
        {% for p in redis_ports %}{% for r in master_ips.results %}{{ r.stdout }}:{{ p }} {% endfor %}{% endfor %}
        --cluster-yes

    # Fail the run here if the topology is not the one the experiment claims.
    - name: Wait until every process is a slot-owning master and the cluster is ok
      shell: |
        set -e
        {{ redis_bin_dir }}/redis-cli -p {{ master_port }} cluster info | grep -q '^cluster_state:ok'
        {{ redis_bin_dir }}/redis-cli -p {{ master_port }} cluster info | grep -q '^cluster_slots_assigned:16384'
        test "$({{ redis_bin_dir }}/redis-cli -p {{ master_port }} cluster nodes | awk '/master/ && NF > 8' | wc -l)" \
          -eq {{ groups['redis_masters'] | length * redis_ports | length }}
      register: cluster_ok
      changed_when: false
      retries: 30
      delay: 1
      until: cluster_ok.rc == 0

    - name: Record cluster topology
      command: "{{ redis_bin_dir }}/redis-cli -p {{ master_port }} cluster nodes"
      register: cluster_nodes
      changed_when: false

    - name: Print cluster topology
      debug:
        msg: "{{ cluster_nodes.stdout_lines }}"
