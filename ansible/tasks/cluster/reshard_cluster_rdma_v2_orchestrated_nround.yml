---
# N-round chunked orchestrated reshard (generalizes
# reshard_cluster_rdma_v2_orchestrated_chunked.yml from a hardcoded 2 rounds to
# `n_rounds` rounds). Smaller chunks per round => each flip touches fewer slots
# => fewer slots two-sided at once => shallower (but more) throughput dips.
#
# Single play: compute shared facts ONCE (peer endpoints, host->IP map, sg4
# dbid/node-argv), pre-warm the peer donors, then loop reshard_one_round.yml
# n_rounds times. Set n_rounds via -e n_rounds=N (default 2).
- name: "RDMA orchestrated chunked reshard: {{ n_rounds | default(2) }} rounds"
  hosts: redis_masters[0]
  become: yes
  gather_facts: no
  vars:
    reshard_target: "{{ groups['redis_migrate'][0] }}"
    reshard_slots_per_source: "{{ (reshard_slots | int) // (groups['redis_masters'] | length) }}"
    # AqRaft: literal default (was self-referential "{{ n_rounds | default(2) }}",
    # which intermittently tripped ansible recursive-template detector). Extra-vars
    # (-e n_rounds=N) still override play vars, so the run scripts' -e n_rounds=1 wins.
    n_rounds: 2
  tasks:
    - name: "Build peer-endpoint list (other donor shardgroup LEADERS)"
      set_fact:
        peer_endpoints: "{{ peer_endpoints | default([]) + [ sg.nodes[0].host ~ ':' ~ sg.port ] }}"
      loop: "{{ redisraft_shardgroups | rejectattr('id', 'equalto', 'sg4') | list }}"
      loop_control:
        loop_var: sg
        label: "{{ sg.id }} -> {{ sg.nodes[0].host }}:{{ sg.port }}"
      when: not (sg.nodes[0].host == inventory_hostname and sg.port | string == master_port | string)

    - name: "Build donor-leader list (for the warm step)"
      set_fact:
        donor_specs: "{{ donor_specs | default([]) + [{'sg_id': sg.id, 'leader_host': sg.nodes[0].host, 'leader_port': sg.port}] }}"
      loop: "{{ redisraft_shardgroups | rejectattr('id', 'equalto', 'sg4') | list }}"
      loop_control:
        loop_var: sg

    - name: "resolve all shardgroup-member IPs"
      shell: "getent hosts {{ item }} | awk '{print $1}'"
      register: narrow_host_ip_lookup
      changed_when: false
      loop: "{{ redisraft_shardgroups | map(attribute='nodes') | sum(start=[]) | map(attribute='host') | unique | list }}"

    - name: "build host->IP map"
      set_fact:
        narrow_host_ip_map: >-
          {{
            dict(
              narrow_host_ip_lookup.results
                | map(attribute='item')
                | zip(narrow_host_ip_lookup.results | map(attribute='stdout'))
            )
          }}

    - name: "probe sg4 leader for raft_dbid"
      shell: |
        {{ redis_bin_dir }}/redis-cli \
          -h {{ narrow_host_ip_map[(redisraft_shardgroups | selectattr('id', 'equalto', 'sg4') | first).nodes[0].host] }} \
          -p {{ (redisraft_shardgroups | selectattr('id', 'equalto', 'sg4') | first).port }} \
          INFO raft \
          | awk -F: '/^raft_dbid:/{print $2}' | tr -d ' \r\n'
      register: sg4_dbid_probe
      changed_when: false

    - name: "stash sg4 dbid"
      set_fact:
        sg4_dbid: "{{ sg4_dbid_probe.stdout }}"

    - name: "build sg4 node-spec fragment"
      set_fact:
        sg4_node_argv: >-
          {{
            sg4_node_argv | default('') +
            sg4_dbid + ('%08x' % nd.raft_id) + ' ' +
            narrow_host_ip_map[nd.host] + ':' +
            ((redisraft_shardgroups | selectattr('id', 'equalto', 'sg4') | first).port | string) + ' '
          }}
      loop: "{{ (redisraft_shardgroups | selectattr('id', 'equalto', 'sg4') | first).nodes }}"
      loop_control:
        loop_var: nd

    # Per-donor JIT WRITE_FLIP: hand each donor leader the sg4 external-shardgroup
    # spec (dbid + node argv) via config, so its migration worker issues
    # RAFT.SHARDGROUP WRITE_FLIP for its OWN slot range right after MGN_TXN_START
    # (instead of ansible flipping all donors up-front each round). The worker
    # supplies the slot range; this spec is the constant tail, same every round.
    # Set on EVERY replica of each donor group, not only the leader: a replica
    # promoted after a donor-leader crash issues the WRITE_FLIP and the ownership
    # handover (NARROW after MGN_TXN_DONE) for the resumed session itself.
    - name: "Set the recipient shardgroup spec on every donor replica (JIT WRITE_FLIP + donor NARROW)"
      shell: |
        {% for nd in sg.nodes %}
        {{ redis_bin_dir }}/redis-cli -h {{ narrow_host_ip_map[nd.host] }} -p {{ sg.port }} \
          CONFIG SET rdma-writeflip-spec "{{ sg4_dbid }} {{ sg4_node_argv | trim }}"
        {% endfor %}
      loop: "{{ redisraft_shardgroups | rejectattr('id', 'equalto', 'sg4') | list }}"
      loop_control:
        loop_var: sg
        label: "{{ sg.id }}"
      changed_when: false

    # PREPARE-AHEAD (peers only): pre-register donor buffers + dial the RDMA link
    # off the critical path. Warms the FULL per-source range so every round
    # reuses it. NOT the orchestrator's own shardgroup (warming self breaks its
    # WRITE_FLIP — see the chunked task's notes).
    - name: "PREPARE-AHEAD (peers): set RDMA port + RDMA MIGRATE-WARM"
      shell: |
        {{ redis_bin_dir }}/redis-cli -h {{ narrow_host_ip_map[spec.leader_host] }} -p {{ spec.leader_port }} \
          CONFIG SET rdma-migration-port {{ 17777 + sg_idx }}
        {{ redis_bin_dir }}/redis-cli -h {{ narrow_host_ip_map[spec.leader_host] }} -p {{ spec.leader_port }} \
          RDMA MIGRATE-WARM {{ reshard_target }} {{ master_port }} {{ reshard_slots_per_source }}
      register: warm_results
      loop: "{{ donor_specs }}"
      loop_control:
        loop_var: spec
        index_var: sg_idx
        label: "{{ spec.sg_id }} warm @ rdma-port {{ 17777 + sg_idx }}"
      # Skipped when reshard_prewarm.yml already ran (-e rdma_prewarm_early=yes).
      when:
        - not (rdma_prewarm_early | default(false) | bool)
        - not (spec.leader_host == inventory_hostname and spec.leader_port | string == master_port | string)
      retries: 3
      delay: 1
      until: warm_results.rc == 0 and 'OK' in (warm_results.stdout | default(''))

    # RECIPIENT chain pre-warm: pre-establish the sg4-leader -> followers chain QPs
    # and pre-register the leader source pool (off the main thread) BEFORE the
    # first migration, so session 1 reuses both (no cold ibv_reg_mr in-window).
    # Sized to the largest round chunk so the cached src-pool MR covers every
    # session. Mirrors the donor MIGRATE-WARM above.
    - name: "PREPARE-AHEAD (recipient): RDMA CHAIN-WARM (pre-establish chain QPs + register src pool)"
      shell: |
        {{ redis_bin_dir }}/redis-cli -h {{ narrow_host_ip_map[reshard_target] }} -p {{ master_port }} \
          RDMA CHAIN-WARM {{ (reshard_slots_per_source | int) - ((reshard_slots_per_source | int) // (n_rounds | int)) * ((n_rounds | int) - 1) }}
      register: chain_warm_result
      when: not (rdma_prewarm_early | default(false) | bool)
      retries: 3
      delay: 1
      until: chain_warm_result.rc == 0 and 'OK' in (chain_warm_result.stdout | default(''))

    # Let the async CHAIN-WARM thread finish establishing the follower QPs +
    # registering the src pool before round 0. Outside the measured window.
    - name: "PREPARE-AHEAD (recipient): wait for CHAIN-WARM to settle"
      pause:
        seconds: 2
      when: not (rdma_prewarm_early | default(false) | bool)

    # Reset the per-donor reshard offset so round 0 starts at the donor's first
    # owned slot. Each donor then self-advances server.rdma_reshard_migrated as it
    # migrates each chunk, so successive rounds pick successive chunks WITHOUT an
    # inter-round NARROW. Set on every donor leader (self + peers).
    - name: "Reset reshard offset (rdma-reshard-migrated=0) on each donor"
      shell: |
        {{ redis_bin_dir }}/redis-cli -h {{ narrow_host_ip_map[sg.nodes[0].host] }} -p {{ sg.port }} \
          CONFIG SET rdma-reshard-migrated 0
      loop: "{{ redisraft_shardgroups | rejectattr('id', 'equalto', 'sg4') | list }}"
      loop_control:
        loop_var: sg
        label: "{{ sg.id }}"
      changed_when: false

    # Run ALL rounds inside ONE shell task — the round loop is in bash, so there
    # is NO ansible per-iteration overhead between rounds. Each round just
    # dispatches its chunk (donor self-offsets) and polls to DONE; the next round
    # dispatches the instant the prior completes => inter-round gap ~0.1s.
    - name: "Run {{ n_rounds }} chunked migration rounds (single shell, bash loop)"
      shell: |
        set -u
        PS={{ reshard_slots_per_source | int }}; NR={{ n_rounds | int }}
        CHUNK=$((PS / NR))
        for RI in $(seq 0 $((NR - 1))); do
          if [ "$RI" -lt $((NR - 1)) ]; then CNT=$CHUNK; else CNT=$((PS - CHUNK * (NR - 1))); fi
          out=$({{ redis_bin_dir }}/redis-cli -p {{ master_port }} RDMA MIGRATE-ALL \
                  {{ reshard_target }} {{ master_port }} $CNT {{ peer_endpoints | join(' ') }})
          oid=$(printf '%s' "$out" | grep -oE 'orchestration_id=[0-9]+' | grep -oE '[0-9]+' | head -1)
          if [ -z "$oid" ]; then echo "round $RI DISPATCH FAILED: $out"; exit 1; fi
          final=TIMEOUT; orchdown=0; down_since=""
          for i in $(seq 1 1200); do
            raw=$({{ redis_bin_dir }}/redis-cli -t 0.3 -p {{ master_port }} RDMA MIGRATE-ALL-STATUS $oid 2>&1)
            st=$(printf '%s' "$raw" | head -1 | grep -oE 'DONE|FAILED' | head -1)
            if [ "$st" = "DONE" ] || [ "$st" = "FAILED" ]; then final=$st; break; fi
            # AqRaft S2: the orchestrator IS -p master_port (redis_masters[0]:8000). On a
            # donor-LEADER crash that is the killed node, so every status query hits a dead
            # orchestrator, never returns DONE, and the loop otherwise burns its full ~60s
            # budget waiting for a DONE that cannot come. Detect the dead orchestrator
            # (connection refused) and break FAST: the migration completes via the
            # become-leader resume, and the recovery-drain below (which watches the LIVE sg4
            # recipient) waits for that correctly. Require ~1s (20 x 0.05) of refusal so a
            # transient blip does not trip it.
            # 2026-10-05: a killed server does not refuse at once. For ~2.8 s it still accepts and
            # just does not answer, so with -t 2 and "refused" only, this loop sat on the dead
            # orchestrator until +2.8 s (3 -> 4 both-leaders run: the new donor leader had given up
            # on the dead recipient at +1.2 s and then waited for the driver). No answer counts
            # like a refusal now, and 0.6 s without one is enough.
            if printf '%s' "$raw" | grep -qiE 'could not connect|connection refused|timed out|timeout|temporarily unavailable|server closed|^Error' || [ -z "$raw" ]; then
              [ -z "$down_since" ] && down_since=$(date +%s.%N)
              if awk -v a="$down_since" -v b="$(date +%s.%N)" 'BEGIN{exit !(b-a >= 0.6)}'; then orchdown=20; fi
            else orchdown=0; down_since=""; fi
            if [ "$orchdown" -ge 20 ]; then
              echo "round $RI orch=$oid: orchestrator (-p {{ master_port }}) unreachable 0.6 s (donor-leader crash) -> skipping dead poll, going to recovery-drain"
              final=ORCHDOWN; break
            fi
            sleep 0.05
          done
          echo "round $RI count=$CNT orch=$oid FINAL=$final"
          if [ "$final" = "DONE" ]; then continue; fi
          # AqRaft leader-crash recovery wait: on a LEADER crash the MIGRATE-ALL
          # orchestration is stuck on the dead node (FINAL=TIMEOUT), but the
          # become-leader hook re-drives the migration on the PROMOTED sg4 leader
          # (verified @500K: recipient DBSIZE recovers + stabilises via B#1 re-ship).
          # Wait for that recovery to DRAIN, then continue so NARROW/EVICT/reconcile
          # finish the ownership handoff and the offload lands. Clean runs hit DONE.
          # AqRaft orchestration RE-DRIVE (S1/S2/S5). A leader crash can kill the
          # orchestrator (it lives in the sg1 leader) or the recipient a donor was
          # dispatched to, so some donors may never have been dispatched, or were
          # dispatched to a dead node. The source of truth is the sg4 durable state:
          # for every donor range, ask the CURRENT sg4 leader MGN-RESUME-STATUS and
          # re-drive each non-durable range from the donor CURRENT leader with
          # MGN-RECOVER (exact slots, query-first: re-ships only what is not durable;
          # the do-not-clobber merge makes a re-ship idempotent). Wait while a range
          # is pending or its donor still has a migration running. Roll-forward only.
          echo "round $RI FINAL=$final -> re-driving from sg4 durable state"
          SG4_EPS="{% for nd in (redisraft_shardgroups | selectattr('id','equalto','sg4') | first).nodes %}{{ narrow_host_ip_map[nd.host] }}:{{ (redisraft_shardgroups | selectattr('id','equalto','sg4') | first).port }} {% endfor %}"
          # donor spec: id:port:slot_lo:ip,ip,ip
          DONORS="{% for sg in redisraft_shardgroups if sg.id != 'sg4' %}{{ sg.id }}:{{ sg.port }}:{{ sg.slot_config.split(':')[0] | int }}:{% for nd in sg.nodes %}{{ narrow_host_ip_map[nd.host] }}{{ ',' if not loop.last else '' }}{% endfor %} {% endfor %}"
          # -t 0.3: a killed server keeps accepting connections for ~2.8 s without answering; with
          # -t 2 the first pass after a leader was killed sat 2 s on it (3 -> 4 both-leaders run,
          # 2026-10-05: the donor had given up on the dead recipient at +1.2 s, re-drive came at +2.8 s).
          role_of() { {{ redis_bin_dir }}/redis-cli -t 0.3 -h "$1" -p "$2" INFO raft 2>/dev/null | awk -F: '/^raft_role:/{print $2}' | tr -d ' \r\n'; }
          sg4_leader() { for ep in $SG4_EPS; do [ "$(role_of ${ep%%:*} ${ep##*:})" = "leader" ] && { echo "$ep"; return; }; done; echo ""; }
          donor_leader() { local pt=$1; for ip in $(echo "$2" | tr ',' ' '); do [ "$(role_of $ip $pt)" = "leader" ] && { echo "$ip"; return; }; done; echo ""; }
          alldone=0
          # Polls every 0.1 s (was: fixed sleeps of 2 s per pass and 3 s per re-drive, which
          # were 2.0 of the ~2.8 s of client downtime after a recipient-leader crash and
          # spaced the three donors' recoveries 3 s apart, 2026-10-04). Donors are still
          # recovered ONE AT A TIME: nothing is dispatched while another donor's migration
          # is running, so two donors never copy into sg4 at once.
          for w in $(seq 1 6000); do
            L4=$(sg4_leader)
            if [ -z "$L4" ]; then sleep 0.1; continue; fi
            L4IP=${L4%%:*}; L4PT=${L4##*:}
            ndur=0; ntot=0; summary=""; inflight=0
            for d in $DONORS; do
              id=$(echo $d | cut -d: -f1); pt=$(echo $d | cut -d: -f2); base=$(echo $d | cut -d: -f3); ips=$(echo $d | cut -d: -f4)
              lo=$((base + CHUNK * RI)); hi=$((lo + CNT - 1)); ntot=$((ntot+1))
              st=$({{ redis_bin_dir }}/redis-cli -t 3 -h $L4IP -p $L4PT RDMA MGN-RESUME-STATUS $lo $hi 2>/dev/null | head -2 | tr '\n' ' ')
              pend=$(echo $st | awk '{print $1}'); miss=$(echo $st | awk '{print $2}')
              case "$pend$miss" in *[!0-9]*|"") summary="$summary $id=?"; continue;; esac
              if [ "$pend" = "0" ] && [ "$miss" = "0" ]; then ndur=$((ndur+1)); summary="$summary $id=durable"; continue; fi
              DL=$(donor_leader $pt $ips)
              if [ -z "$DL" ]; then summary="$summary $id=no-leader"; continue; fi
              mst=$({{ redis_bin_dir }}/redis-cli -t 2 -h $DL -p $pt RDMA MIGRATE-STATUS 2>/dev/null | head -1 | tr -d '\r')
              if [ "$pend" != "0" ] || { [ -n "$mst" ] && ! echo "$mst" | grep -qE 'DONE|FAILED|ERR|no migrations'; }; then
                summary="$summary $id=waiting(p=$pend,m=$miss,donor=$mst)"; inflight=1; continue
              fi
              if [ "$inflight" = "1" ]; then summary="$summary $id=queued"; continue; fi
              key="D_${id}_$(echo $L4 | tr '.:' '__')"
              n=$(eval echo \${$key:-0})
              if [ "$n" -ge 3 ]; then summary="$summary $id=gave-up"; continue; fi
              tok=$((700 + RI * 100 + n * 10 + ${id#sg}))
              {{ redis_bin_dir }}/redis-cli -t 5 -h $DL -p $pt RDMA MGN-RECOVER donor $tok \
                "sess=$tok slots=$lo-$hi n=$CNT recipient=$L4IP:$L4PT" >/dev/null 2>&1
              eval "$key=$((n+1))"
              echo "  re-drive: $id slots=$lo-$hi from $DL:$pt -> sg4 leader $L4 (missing=$miss, attempt $((n+1)), token $tok)"
              summary="$summary $id=dispatched"; inflight=1
              # let MIGRATE-STATUS show the new worker before the next pass (at most 3 s)
              for z in $(seq 1 60); do
                m2=$({{ redis_bin_dir }}/redis-cli -t 2 -h $DL -p $pt RDMA MIGRATE-STATUS 2>/dev/null | head -1 | tr -d '\r')
                echo "$m2" | grep -qE 'DONE|FAILED|ERR|no migrations' || break
                sleep 0.05
              done
            done
            [ $((w % 50)) -eq 1 ] && echo "  re-drive poll $w: sg4 leader=$L4 $ndur/$ntot durable:$summary"
            if [ "$ndur" -eq "$ntot" ]; then echo "RE-DRIVE COMPLETE: all $ntot donor ranges durable on sg4 leader $L4 -> NARROW"; alldone=1; break; fi
            sleep 0.1
          done
          [ "$alldone" = "1" ] || { echo "RE-DRIVE INCOMPLETE: not every donor range is durable on sg4 (see polls above)"; exit 1; }
        done
      register: all_rounds
      changed_when: true

    # async-apply MERGE-DRAIN BARRIER: with rdma-async-apply the recipient reports
    # each donor "done" on COMMIT (chain replicated to majority + MGN_RECP_DURABLE
    # logged) WITHOUT waiting for the keyspace merge to execute — so when the
    # rounds loop above returns, the last round's merges may still be draining
    # into db[0]. NARROW hands the slots to sg4 and stops the donor serving, so it
    # MUST NOT fire while keys are still un-merged on the recipient (there is no
    # landing-pool read fallback — reads MOVED to sg4 would miss). Poll the
    # recipient until its in-flight merge counter returns to 0. This is OFF the
    # measured migration window (the window ended at the last donor's commit).
    # AqRaft S2 backstop: bounded, self-contained wait that ALWAYS proceeds instead
    # of the old 600-retry hard-abort. A session with no live driver (donor-LEADER
    # crash, unresumed) pins the counter forever; the old barrier then failed the
    # whole orchestration (NARROW/EVICT/reconcile never ran -> +8% at best). Now:
    # proceed when the counter drains to 0 (normal), OR is UNCHANGED for 30s (a
    # genuinely-stuck session -> NARROW the donors that DID complete; offload is
    # partial for the stuck one), OR after a 300s ceiling. "unchanged 30s" is safe:
    # an actively-draining merge decrements the counter (a 3M merge drains in ~2s),
    # so a flat counter means stuck, not draining.
    - name: "async-apply: wait for recipient merges to drain before NARROW (bounded; proceed on drain/stall)"
      shell: |
        set -u
        SG4_EPS="{% for nd in (redisraft_shardgroups | selectattr('id','equalto','sg4') | first).nodes %}{{ narrow_host_ip_map[nd.host] }}:{{ (redisraft_shardgroups | selectattr('id','equalto','sg4') | first).port }} {% endfor %}"
        leadval() {
          for ep in $SG4_EPS; do
            ip=${ep%%:*}; pt=${ep##*:}
            role=$({{ redis_bin_dir }}/redis-cli -t 2 -h "$ip" -p "$pt" INFO raft 2>/dev/null | awk -F: '/^raft_role:/{print $2}' | tr -d ' \r\n')
            if [ "$role" = "leader" ]; then
              {{ redis_bin_dir }}/redis-cli -t 2 -h "$ip" -p "$pt" INFO cluster | tr -d '\r' | grep -oE 'rdma_recipient_backpatch_in_progress:[0-9]+' | cut -d: -f2
              return 0
            fi
          done
          echo ""
        }
        prev="x"; stable=0
        for w in $(seq 1 300); do
          val=$(leadval)
          if [ "${val:-}" = "0" ]; then echo "DRAINED: backpatch_in_progress=0 after ${w}s -> NARROW"; exit 0; fi
          if [ -n "${val:-}" ] && [ "$val" = "$prev" ]; then stable=$((stable+1)); else stable=0; fi
          if [ "$stable" -ge 30 ]; then echo "STALL: backpatch_in_progress=$val unchanged 30s (unresumed session) -> proceeding to NARROW completed donors (partial offload)"; exit 0; fi
          prev="$val"; sleep 1
        done
        echo "TIMEOUT: backpatch_in_progress not drained in 300s -> proceeding"; exit 0
      register: merge_drain
      changed_when: false
      when: (rdma_async_apply | default('no')) == 'yes'

    # NARROW, batched ONCE after all rounds (out of the inter-round path): hand
    # sg4 the full migrated per-source range and shrink each donor. Per-round
    # NARROW is no longer needed because the donor self-offsets chunk selection.
    # leader-aware: a donor-LEADER crash (S2) leaves the configured leader dead, so
    # NARROW must target the CURRENT sg leader (else Connection refused -> abort).
    - name: "NARROW each donor -> sg4 (full per-source range, batched, leader-aware)"
      shell: |
        set -u
        rm -f /tmp/fin_narrow_*.out
        dleader() {  # $1=port, rest=candidate ips -> echo the live leader ip (fallback: first)
          local pt=$1; shift; local first=$1
          for ip in "$@"; do
            role=$({{ redis_bin_dir }}/redis-cli -t 2 -h "$ip" -p "$pt" INFO raft 2>/dev/null | awk -F: '/^raft_role:/{print $2}' | tr -d ' \r\n')
            [ "$role" = "leader" ] && { echo "$ip"; return; }
          done
          echo "$first"
        }
        {% for sg in redisraft_shardgroups if sg.id != 'sg4' %}
        DL=$(dleader {{ sg.port }} {% for nd in sg.nodes %}{{ narrow_host_ip_map[nd.host] }} {% endfor %})
        {{ redis_bin_dir }}/redis-cli -h "$DL" -p {{ sg.port }} \
          RAFT.SHARDGROUP NARROW \
            {{ (sg.slot_config.split(':')[0] | int) + (reshard_slots_per_source | int) }}:{{ sg.slot_config.split(':')[1] | int }} \
            {{ sg4_dbid }} 1 3 \
            {{ sg.slot_config.split(':')[0] | int }} {{ (sg.slot_config.split(':')[0] | int) + (reshard_slots_per_source | int) - 1 }} 1 0 \
            {{ sg4_node_argv }} > /tmp/fin_narrow_{{ sg.id }}.out 2>&1 &
        {% endfor %}
        wait
        ok=$(grep -l OK /tmp/fin_narrow_*.out | wc -l); cat /tmp/fin_narrow_*.out
        test "$ok" -eq {{ (redisraft_shardgroups | rejectattr('id','equalto','sg4') | list) | length }}
      register: fin_narrow
      retries: 5
      delay: 1
      until: fin_narrow.rc == 0

    # Donor offload, batched ONCE after all rounds (out of the inter-round path):
    # drop each donor's now-foreign migrated keys (full per-source range) so it
    # stops serving them and is actually offloaded — turning the migration from a
    # copy into a move. sg4 already owns + serves the data, so this is safe.
    #
    # ENABLED: donor-cleanup EVICT turns the migration from a copy into a MOVE so
    # the (saturated) donors actually shed the migrated slots' load onto the idle
    # recipient sg4 -> aggregate throughput rises. Comment out for a copy-only run.
    - name: "EVICT migrated slots on each donor (offload — batched, copy -> move, leader-aware)"
      shell: |
        set -u
        pt={{ sg.port }}; DL=""
        for ip in {% for nd in sg.nodes %}{{ narrow_host_ip_map[nd.host] }} {% endfor %}; do
          role=$({{ redis_bin_dir }}/redis-cli -t 2 -h "$ip" -p "$pt" INFO raft 2>/dev/null | awk -F: '/^raft_role:/{print $2}' | tr -d ' \r\n')
          [ "$role" = "leader" ] && { DL="$ip"; break; }
        done
        [ -n "$DL" ] || DL={{ narrow_host_ip_map[sg.nodes[0].host] }}
        {{ redis_bin_dir }}/redis-cli -h "$DL" -p "$pt" \
          RDMA EVICT-SLOTS {{ sg.slot_config.split(':')[0] | int }} \
          {{ (sg.slot_config.split(':')[0] | int) + (reshard_slots_per_source | int) - 1 }}
      register: evict_results
      loop: "{{ redisraft_shardgroups | rejectattr('id', 'equalto', 'sg4') | list }}"
      loop_control:
        loop_var: sg
        label: "{{ sg.id }}: evict {{ sg.slot_config.split(':')[0] }}:{{ (sg.slot_config.split(':')[0] | int) + (reshard_slots_per_source | int) - 1 }}"
      changed_when: false
      # AqRaft EXPERIMENT: EVICT disabled to test whether the synchronous
      # clusterDelKeysInSlot() sweep (deleting the migrated keys on the donor main
      # threads) is what causes the ~7s throughput drop-to-zero right after NARROW.
      # With this off the migration is a COPY (donors keep the migrated keys as dead
      # weight) — ownership still transfers via NARROW/reconcile, so clients still
      # route the migrated slots to sg4. Re-enable by removing this when: false.
      when: false

    # AqRaft ownership reconcile: NARROW leaves each shardgroup knowing only its
    # OWN handover and sg4 still advertising its full configured range, so the
    # cluster-wide slot map is inconsistent per node and clients under-route to
    # the recipient (no throughput gain). Push the authoritative final topology
    # (each donor's narrowed range + sg4 = the complement) to EVERY leader so all
    # nodes agree and clients route the full offload to sg4. Idempotent.
    - name: "Reconcile cluster-wide slot ownership across all shardgroups (offload routing)"
      command: python3 {{ main_dir }}/ansible/reconcile_ownership.py {{ redis_bin_dir }}/redis-cli
      run_once: true
      register: reconcile_out
      changed_when: false

    - name: "Ownership reconcile result"
      debug:
        msg: "{{ reconcile_out.stdout_lines }}"

