---
# Per-round task — ONE shell task (dispatch + poll inline) to minimise the
# inter-round gap. The donor self-advances its slot offset
# (server.rdma_reshard_migrated), the per-donor WRITE_FLIP is server-side, and
# NARROW + EVICT are batched after all rounds — so a round is just: dispatch the
# chunk, poll to DONE. Collapsing it to a single ansible task (no per-round
# set_facts / separate parse / debug) keeps the inter-round gap ~0.2s.
#
# Expects: round_idx, n_rounds, reshard_slots_per_source, peer_endpoints,
#          reshard_target, master_port, redis_bin_dir.
- name: "Round {{ round_idx }}: dispatch RDMA MIGRATE-ALL + poll to DONE (single task)"
  shell: |
    set -u
    PS={{ reshard_slots_per_source | int }}; NR={{ n_rounds | int }}; RI={{ round_idx | int }}
    CHUNK=$((PS / NR))
    if [ "$RI" -lt $((NR - 1)) ]; then CNT=$CHUNK; else CNT=$((PS - CHUNK * (NR - 1))); fi
    out=$({{ redis_bin_dir }}/redis-cli -p {{ master_port }} RDMA MIGRATE-ALL \
            {{ reshard_target }} {{ master_port }} $CNT {{ peer_endpoints | join(' ') }})
    oid=$(printf '%s' "$out" | grep -oE 'orchestration_id=[0-9]+' | grep -oE '[0-9]+' | head -1)
    if [ -z "$oid" ]; then echo "DISPATCH FAILED: $out"; exit 1; fi
    final=TIMEOUT; orchdown=0
    for i in $(seq 1 1200); do
      raw=$({{ redis_bin_dir }}/redis-cli -t 2 -p {{ master_port }} RDMA MIGRATE-ALL-STATUS $oid 2>&1)
      st=$(printf '%s' "$raw" | head -1 | grep -oE 'DONE|FAILED' | head -1)
      if [ "$st" = "DONE" ] || [ "$st" = "FAILED" ]; then final=$st; break; fi
      # AqRaft S2: -p master_port is the orchestrator = the node a donor-leader crash kills;
      # polling a dead orchestrator never returns DONE. Break fast to the recovery-drain.
      if printf '%s' "$raw" | grep -qiE 'could not connect|connection refused'; then orchdown=$((orchdown+1)); else orchdown=0; fi
      if [ "$orchdown" -ge 20 ]; then echo "orch=$oid unreachable ~1s (donor-leader crash) -> recovery-drain"; final=ORCHDOWN; break; fi
      sleep 0.05
    done
    echo "Round $RI count=$CNT orch=$oid FINAL=$final attempts=$i"
    if [ "$final" = "DONE" ]; then exit 0; fi
    # AqRaft leader-crash recovery wait: on a recipient/donor LEADER crash the
    # MIGRATE-ALL orchestration is stuck on the dead node (FINAL=TIMEOUT), but the
    # become-leader hook re-drives the migration on the PROMOTED sg4 leader
    # (verified: recipient DBSIZE recovers + stabilises via B#1 re-ship). Wait for
    # that recovery to DRAIN, then succeed so NARROW/EVICT/reconcile finish the
    # ownership handoff and the offload lands. Clean runs exit DONE above.
    echo "reshard FINAL=$final -> waiting for become-leader recovery on sg4 to drain"
    SG4_EPS="{% for nd in (redisraft_shardgroups | selectattr('id','equalto','sg4') | first).nodes %}{{ narrow_host_ip_map[nd.host] }}:{{ (redisraft_shardgroups | selectattr('id','equalto','sg4') | first).port }} {% endfor %}"
    prev=-1; stable=0
    for w in $(seq 1 300); do
      lead=""; ldb=0
      for ep in $SG4_EPS; do
        ip=${ep%%:*}; pt=${ep##*:}
        role=$({{ redis_bin_dir }}/redis-cli -t 2 -h "$ip" -p "$pt" INFO raft 2>/dev/null | awk -F: '/^raft_role:/{print $2}' | tr -d ' \r\n')
        if [ "$role" = "leader" ]; then lead=$ip; ldb=$({{ redis_bin_dir }}/redis-cli -t 2 -h "$ip" -p "$pt" DBSIZE 2>/dev/null); break; fi
      done
      if [ -n "$lead" ] && [ "${ldb:-0}" -gt 1000 ] && [ "$ldb" = "$prev" ]; then
        stable=$((stable+1))
        if [ "$stable" -ge 12 ]; then echo "recovery DRAINED: sg4 leader=$lead DBSIZE=$ldb (stable 12s) -> proceeding to NARROW"; exit 0; fi
      else
        stable=0
      fi
      prev=$ldb; sleep 1
    done
    echo "sg4 recovery did NOT drain within timeout"; exit 1
  register: rn_round
  changed_when: true
